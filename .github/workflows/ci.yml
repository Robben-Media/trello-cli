name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Run fmt-check
        run: make fmt-check

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Build (CGO enabled for keyring)
        run: CGO_ENABLED=1 go build -o bin/trello-cli ./cmd/trello

      - name: Check native macOS keyring availability (empty)
        timeout-minutes: 1
        shell: bash
        env:
          TRELLO_CLI_KEYRING_BACKEND: keychain
        run: |
          ./bin/trello-cli --json auth status | python3 -c 'import json, sys; s = json.load(sys.stdin); assert s["has_key"] is False and s["has_token"] is False'

      - name: Test headless encrypted keyring roundtrip
        timeout-minutes: 1
        shell: bash
        env:
          TRELLO_CLI_KEYRING_BACKEND: file
          TRELLO_CLI_KEYRING_PASS: ci-only-dummy-password
        run: |
          echo "testkey" | ./bin/trello-cli auth set-key --stdin
          echo "testtoken" | ./bin/trello-cli auth set-token --stdin
          ./bin/trello-cli --json auth status | python3 -c 'import json, sys; s = json.load(sys.stdin); assert s["has_key"] is True and s["has_token"] is True'
          ./bin/trello-cli auth remove
          ./bin/trello-cli --json auth status | python3 -c 'import json, sys; s = json.load(sys.stdin); assert s["has_key"] is False and s["has_token"] is False'

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -o bin/trello-cli.exe ./cmd/trello

      - name: Test keyring
        run: |
          "testkey" | .\bin\trello-cli.exe auth set-key --stdin
          "testtoken" | .\bin\trello-cli.exe auth set-token --stdin
          .\bin\trello-cli.exe auth status
